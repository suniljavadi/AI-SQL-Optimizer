services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: optimizer
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://optimizer:optimizer@db:5432/optimizer
      LLM_MODE: mock
    ports: ["8000:8000"]
    depends_on: [db]
  ui:
    build: .
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  pgdata:
